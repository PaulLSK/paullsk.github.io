        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', 'Garamond', serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, #f8faf9 100%);

        }
        
        .header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-main) 100%);

            padding: 30px 20px;

            box-shadow: 0 4px 20px rgba(26, 77, 62, 0.3);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.95;
            font-style: italic;
        }
        
        .container {
            max-width: 98%;
            margin: 15px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(26, 77, 62, 0.12);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .controls {
            padding: 20px;
            background: linear-gradient(to bottom, var(--bg-light), rgba(255, 255, 255, 0.5));
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            align-items: end;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .control-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .control-group select,
        .control-group input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background: white;
            color: var(--text-primary);
            font-family: 'Georgia', serif;
            cursor: pointer;
        }
        
        .control-group select:hover,
        .control-group input:hover {
            border-color: var(--accent-brass);
        }
        
        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(61, 139, 115, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--accent-brass), #d4a574);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            font-family: 'Georgia', serif;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.3);
        }
        
        .btn.secondary {
            background: linear-gradient(135deg, rgba(61, 139, 115, 0.2), rgba(91, 168, 148, 0.1));
            color: var(--primary-dark);
            border: 1px solid var(--primary-light);
        }
        
        .btn.secondary:hover {
            background: linear-gradient(135deg, rgba(61, 139, 115, 0.3), rgba(91, 168, 148, 0.2));

        .map-container {
            width: 100%;

            background: rgba(61, 139, 115, 0.04);

            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-secondary);

</head>

            </div>

                </select>
            </div>

                <select id="group-select" onchange="updateHeatmap()">

                    <option value="game" title="Walleye, Northern Pike, Lake Trout, Smallmouth Bass, Largemouth Bass">Game Fish (Walleye, Northern Pike, Lake Trout, Bass)</option>
                    <option value="trout" title="Rainbow Trout, Brown Trout, Brook Trout, Cutthroat Trout, Tiger Trout, Splake">Trout (Rainbow, Brown, Brook, Cutthroat, Tiger, Splake)</option>

                </select>
            </div>
            
            <div class="control-group">
                <label for="colorscale">Color Scale:</label>
                <select id="colorscale" onchange="updateHeatmap()">
                    <option value="Viridis">Viridis (Default)</option>
                    <option value="matplotlib_plasma">Plasma (Matplotlib)</option>
                    <option value="Cividis">Cividis</option>

            <div class="control-group">

            </div>
            
            <div class="button-group">

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set default values for form controls
            document.getElementById('filter-type').value = 'all';
            document.getElementById('colorscale').value = 'Viridis';
            document.getElementById('basemap').value = 'standard';
            document.getElementById('radius').value = '20';
            document.getElementById('show-markers').checked = false;
            
            populateSpeciesDropdown();
            updateHeatmap();
        });
        
        function populateSpeciesDropdown() {
            const select = document.getElementById('species-select');
            ALL_SPECIES.forEach(species => {
                const option = document.createElement('option');
                option.value = species;
                option.textContent = species;
                select.appendChild(option);
            });
        }
        
        function updateFilterUI() {
            const filterType = document.getElementById('filter-type').value;
            document.getElementById('species-selector').style.display = filterType === 'species' ? 'flex' : 'none';
            document.getElementById('group-selector').style.display = filterType === 'group' ? 'flex' : 'none';
            updateHeatmap();
        }
        
        function getFilteredData() {
            const filterType = document.getElementById('filter-type').value;
            
            if (filterType === 'none') {
                return [];
            }
            
            if (filterType === 'all') {
                return BASE_DIVERSITY_DATA;
            }
            
            // Filter by specific species
            if (filterType === 'species') {
                const selectedSpecies = document.getElementById('species-select').value;
                if (!selectedSpecies) {
                    return BASE_DIVERSITY_DATA;
                }
                
                return BASE_DIVERSITY_DATA.filter(d => {
                    const speciesList = d.species_list.split(',').map(s => s.trim());
                    return speciesList.includes(selectedSpecies);
                });
            }
            
            // Filter by species group
            if (filterType === 'group') {
                const selectedGroup = document.getElementById('group-select').value;
                if (!selectedGroup) {
                    return BASE_DIVERSITY_DATA;
                }
                
                const groupSpecies = {
                    'game': ['Walleye', 'Northern Pike', 'Lake Trout', 'Smallmouth Bass', 'Largemouth Bass'],
                    'trout': ['Rainbow Trout', 'Brown Trout', 'Brook Trout', 'Cutthroat Trout', 'Tiger Trout', 'Splake', 'Splake Trout'],
                    'non_game': ['White Sucker', 'Burbot', 'Cisco', 'Lake Whitefish']
                };
                
                const targetSpecies = groupSpecies[selectedGroup] || [];
                
                return BASE_DIVERSITY_DATA.filter(d => {
                    const speciesList = d.species_list.split(',').map(s => s.trim());
                    return speciesList.some(species => targetSpecies.includes(species));
                });
            }
            
            return BASE_DIVERSITY_DATA;
        }
        
        function updateHeatmap() {
            const data = getFilteredData();
            
            if (!data || data.length === 0) {
                document.getElementById('map').innerHTML = '';
                document.getElementById('stat-count').textContent = '0';
                document.getElementById('stat-range').textContent = '0-0';
                return;
            }
            
            const lats = data.map(d => d.latitude);
            const lons = data.map(d => d.longitude);
            const counts = data.map(d => d.species_count);
            const names = data.map(d => d.waterbody_name);
            const species_lists = data.map(d => d.species_list);
            
            let colorscale = document.getElementById('colorscale').value;
            // Map custom matplotlib colorscale selections to actual colorscales
            if (MATPLOTLIB_COLORSCALES[colorscale]) {
                colorscale = MATPLOTLIB_COLORSCALES[colorscale];
            }
            
            const radius = parseInt(document.getElementById('radius').value);
            const showMarkers = document.getElementById('show-markers').checked;
            
            document.getElementById('radius-value').textContent = radius + ' px';
            
            const heatmapTrace = {
                type: 'densitymapbox',
                lat: lats,
                lon: lons,
                z: counts,
                radius: radius,
                colorscale: colorscale,
                colorbar: {
                    title: 'Species<br>Count',
                    thickness: 15,
                    len: 0.7
                },
                hovertext: names.map((n, i) => `<b>${n}</b><br>Species: ${counts[i]}<br>Species list: ${species_lists[i]}`),
                hoverinfo: 'text',
                showscale: true
            };
            
            const traces = [heatmapTrace];
            
            // Add markers if requested
            if (showMarkers) {
                traces.push({
                    type: 'scattermapbox',
                    lat: lats,
                    lon: lons,
                    mode: 'markers',
                    marker: {
                        size: counts.map(c => Math.sqrt(c) * 3),
                        opacity: 0.6,
                        color: counts,
                        colorscale: Array.isArray(colorscale) ? colorscale : document.getElementById('colorscale').value,
                        showscale: false,
                        cmin: Math.min(...counts),
                        cmax: Math.max(...counts)
                    },
                    hovertext: names.map((n, i) => `<b>${n}</b><br>Species: ${counts[i]}`),
                    hoverinfo: 'text',
                    showlegend: false
                });
            }
            
            // Single mapbox layout block - preserve current zoom/center if map exists
            const basemapKey = document.getElementById('basemap').value;
            const basemapStyleMap = {
                // Plotly ships Mapbox GL JS v2; remap v3-only styles to supported equivalents
                'standard': 'mapbox://styles/mapbox/streets-v12',
                'standard-satellite': 'mapbox://styles/mapbox/satellite-streets-v12',
                'light-v11': 'mapbox://styles/mapbox/light-v11',
                'dark-v11': 'mapbox://styles/mapbox/dark-v11'
            };
            const basemapStyle = basemapStyleMap[basemapKey] || basemapStyleMap['standard'];
            const mapDiv = document.getElementById('map');
            let currentCenter = { lon: -106, lat: 52 };
            let currentZoom = 4;
            
            // Preserve current view if map already exists
            if (mapDiv.layout && mapDiv.layout.mapbox) {
                currentCenter = mapDiv.layout.mapbox.center || currentCenter;
                currentZoom = mapDiv.layout.mapbox.zoom || currentZoom;
            }
            
            const layout = {
                mapbox: {
                    accesstoken: MAPBOX_TOKEN,
                    style: basemapStyle,
                    center: currentCenter,
                    zoom: currentZoom
                },
                margin: { r: 0, t: 0, l: 0, b: 0 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                height: mapDiv.offsetHeight
            };
            
            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['lasso2d', 'select2d']
            };
            
            Plotly.newPlot('map', traces, layout, config);
            
            // Add click handler to zoom to markers
            if (showMarkers) {
                mapDiv.on('plotly_click', function(data) {
                    const pt = data.points[0];
                    if (pt.lat && pt.lon) {
                        Plotly.relayout('map', {
                            'mapbox.center': { lon: pt.lon, lat: pt.lat },
                            'mapbox.zoom': 10
                        });
                    }
                });
            }
            
            // Update statistics
            document.getElementById('stat-count').textContent = data.length;
            document.getElementById('stat-range').textContent = 
                Math.min(...counts) + ' - ' + Math.max(...counts);
        }
        
        function resetFilters() {
            document.getElementById('filter-type').value = 'all';
            document.getElementById('species-select').value = '';
            document.getElementById('group-select').value = '';
            document.getElementById('colorscale').value = 'Viridis';
            document.getElementById('basemap').value = 'light-v11';
            document.getElementById('radius').value = '20';
            document.getElementById('show-markers').checked = false;
            updateFilterUI();
            // Reset zoom to default
            const mapDiv = document.getElementById('map');
            if (mapDiv.layout) {
                Plotly.relayout('map', {
                    'mapbox.center': { lon: -106, lat: 52 },
                    'mapbox.zoom': 4
                });
            }
        }
        
        function downloadMap() {
            const element = document.getElementById('map');
            const mapDiv = document.getElementById('map');
            const currentLayout = mapDiv.layout;
            
            // Get current map center and zoom
            const currentCenter = currentLayout.mapbox.center;
            const currentZoom = currentLayout.mapbox.zoom;
            
            // Double the resolution while maintaining current view
            const width = element.offsetWidth * 2;
            const height = element.offsetHeight * 2;
            
            Plotly.downloadImage(element, {
                format: 'png', 
                width: width, 
                height: height, 
                filename: 'species_diversity_heatmap'
            });
        }
        
        // Handle window resize
        window.addEventListener('resize', function() {
            const mapDiv = document.getElementById('map');
            Plotly.Plots.resize(mapDiv);
        });
    </script>
